<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>崩潰教練</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: full-screen 3D canvas; HUD pinned top; student bubble + voice status pinned bottom; cards overlay. Single sunny-cartoon look. */
:root{
  --sky:#8fd3ff; --ink:#1d2340; --paper:#fffaf0; --sun:#ffc93c; --tomato:#ff5a4e; --mint:#2fbf8f; --steel:#5a6488; --cream:#f2ecdc;
  --font-display:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  --font-body:"Noto Sans TC","Baloo 2",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important;}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#stage{position:fixed;inset:0;}
#stage canvas{display:block;width:100%;height:100%;}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);}

.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;}
.left-col{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:62%;}
.goal{padding:6px 10px;}
.goal small{display:block;font-size:10px;letter-spacing:.06em;color:var(--steel);font-weight:700;}
.goal b{display:block;font-size:14px;line-height:1.35;}
.nav{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;align-self:flex-start;background:var(--sun);}
.hintTxt{font-size:15px;font-weight:900;line-height:1.25;}
.cmdpanel{padding:6px 8px;display:flex;flex-direction:column;gap:2px;align-self:flex-start;max-width:150px;pointer-events:none;}
.cmdpanel h3{margin:0 0 2px;font-size:10px;letter-spacing:.08em;color:var(--steel);font-weight:900;}
.cmdrow{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:1.35;padding:1px 5px;border-radius:7px;}
.cmdrow b{font-weight:900;white-space:nowrap;}
.cmdrow span{color:var(--steel);font-size:10px;white-space:nowrap;}
.cmdrow.hot{background:var(--ink);color:var(--paper);}
.cmdrow.hot span{color:var(--sun);}
.gatePrompt{font-weight:900;font-size:14px;padding:8px 12px;background:var(--sun);text-align:center;max-width:560px;width:100%;}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.mode{border:3px solid var(--ink);border-radius:16px;padding:12px 10px;background:var(--cream);text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 var(--ink);}
.mode b{font-size:17px;}
.mode span{font-size:12px;color:var(--steel);line-height:1.45;}
.mode em{font-style:normal;font-size:12px;font-weight:900;color:var(--tomato);}
.mode:focus-visible{outline:3px solid var(--tomato);outline-offset:2px;}
#pigeon{position:fixed;left:50%;top:44%;width:min(70vw,360px);aspect-ratio:1.3;transform:translate(-50%,-50%) rotate(-8deg);pointer-events:none;z-index:3;}
#pigeon .body{position:absolute;inset:18% 10% 10% 8%;background:#8a93a8;border-radius:50% 55% 45% 50%;border:5px solid var(--ink);}
#pigeon .head{position:absolute;left:62%;top:2%;width:30%;aspect-ratio:1;background:#6f7891;border-radius:50%;border:5px solid var(--ink);}
#pigeon .eye{position:absolute;left:70%;top:14%;width:9%;aspect-ratio:1;background:#fff;border-radius:50%;border:3px solid var(--ink);}
#pigeon .beak{position:absolute;left:88%;top:20%;width:12%;height:8%;background:var(--sun);border:3px solid var(--ink);border-radius:0 60% 60% 0;}
#pigeon .wing{position:absolute;left:18%;top:34%;width:46%;height:36%;background:#a7afc2;border:5px solid var(--ink);border-radius:60% 40% 60% 40%;}
@media (max-height:560px){ .cmdpanel{display:none;} }
.arrow{width:42px;height:42px;border-radius:50%;background:var(--mint);display:grid;place-items:center;border:3px solid var(--ink);flex:none;}
.arrow svg{width:24px;height:24px;}
.navtxt{display:flex;flex-direction:column;line-height:1.1;}
.navtxt b{font-family:var(--font-display);font-size:14px;font-variant-numeric:tabular-nums;}
.navtxt span{font-size:11px;color:var(--steel);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:3px 9px;font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;border-radius:10px;}
.chip.warn{background:var(--tomato);color:#fff;}
.chip.ok{background:var(--mint);color:#fff;}
.right-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
#mini{width:104px;height:104px;display:block;border-radius:11px;}
.mini-wrap{overflow:hidden;}
.lang{display:flex;padding:3px;gap:3px;pointer-events:auto;}
.lang button{font:700 12px var(--font-body);border:0;background:transparent;color:var(--ink);padding:4px 8px;border-radius:9px;cursor:pointer;}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}

.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);font:900 clamp(22px,7vw,34px) var(--font-display);color:#fff;background:var(--tomato);border:4px solid var(--ink);border-radius:18px;padding:8px 18px;box-shadow:0 6px 0 var(--ink);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.toast.good{background:var(--mint);}

.deck{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.talk{width:100%;max-width:560px;display:flex;flex-direction:column;gap:6px;}
.bubble{align-self:flex-start;max-width:88%;padding:7px 12px;font-weight:700;font-size:15px;}
.bubble::before{content:attr(data-who);display:block;font-size:10px;color:var(--steel);letter-spacing:.06em;font-weight:700;}
.heard{align-self:flex-end;max-width:88%;padding:6px 12px;background:var(--ink);color:var(--paper);border-radius:14px;font-size:13px;min-height:30px;}
.heard:empty{display:none;}
.heard em{font-style:normal;color:var(--sun);}
.voice{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;}
.voice .dot{width:10px;height:10px;border-radius:50%;background:var(--steel);}
.voice.on .dot{background:var(--tomato);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.25}}
.notice{font-size:12px;background:var(--paper);border:2px dashed var(--tomato);border-radius:10px;padding:6px 10px;max-width:560px;width:100%;line-height:1.5;}

.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(29,35,64,.55);z-index:5;overflow-y:auto;}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;}
.card h1{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1;margin:0;text-wrap:balance;}
.card h1 small{display:block;font-size:.4em;color:var(--steel);letter-spacing:.08em;margin-top:6px;}
.card h2{font-size:22px;margin:0;line-height:1.2;text-wrap:balance;}
.card p{margin:0;line-height:1.6;font-size:14px;}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--steel);}
.student{display:flex;gap:10px;align-items:center;background:var(--cream);border-radius:14px;padding:10px;}
.face{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);flex:none;position:relative;overflow:hidden;}
.face i{position:absolute;left:0;right:0;top:0;height:42%;}
.student b{display:block;}
.student span{font-size:12px;color:var(--steel);line-height:1.4;}
.say{background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;}
.say em{font-style:normal;color:var(--sun);font-weight:900;}
.cmds{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;background:var(--cream);border-radius:12px;padding:10px 12px;}
.cmds dt{font-weight:900;}
.cmds dd{margin:0;color:var(--steel);}
.stars{font-size:40px;letter-spacing:6px;color:var(--sun);-webkit-text-stroke:2px var(--ink);text-align:center;line-height:1;}
.stars .off{color:#e2dccb;}
.result{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center;}
.result div{background:var(--cream);border-radius:12px;padding:8px 4px;}
.result b{display:block;font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums;}
.result span{font-size:11px;color:var(--steel);}
.tapnote{font-size:11px;color:var(--steel);text-align:center;}
@media (prefers-reduced-motion:reduce){.voice.on .dot{animation:none}.toast{transition:none}}
</style>

<div id="stage"></div>

<div class="hud">
  <div class="left-col">
    <div class="panel goal"><small id="goalLbl">自由駕駛</small><b id="goalTxt">開到旗子的位置挑戰關卡</b></div>
    <div class="panel nav">
      <div class="arrow"><svg id="arrowSvg" viewBox="0 0 24 24"><path d="M12 2 L20 20 L12 15 L4 20 Z" fill="#fffaf0" stroke="#1d2340" stroke-width="2" stroke-linejoin="round"/></svg></div>
      <div class="navtxt"><span class="hintTxt" id="hintTxt">說「開車」起步</span><span><b id="dist">0 m</b> · <span id="distLbl">下一個目標</span></span></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="panel cmdpanel" id="cmdPanel" hidden><h3 id="cmdTitle">你可以說</h3><div id="cmdRows"></div></div>
  </div>
  <div class="right-col">
    <div class="panel lang" role="group" aria-label="Language"><button id="lzh" aria-pressed="true">中文</button><button id="len" aria-pressed="false">EN</button></div>
    <div class="panel mini-wrap"><canvas id="mini" width="208" height="208"></canvas></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="deck">
  <div class="talk">
    <div class="bubble panel" id="bubble" data-who="學員">……</div>
    <div class="heard" id="heard"></div>
  </div>
  <div class="panel gatePrompt" id="gatePrompt" hidden></div>
  <div class="notice" id="notice" hidden></div>
  <div class="voice panel" id="voice"><span class="dot"></span><span id="voiceTxt">語音未啟動</span></div>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <h1 id="tTitle">崩潰教練<small id="tSub">PANIC COACH</small></h1>
    <p id="tDesc"></p>
    <dl class="cmds" id="cmdList"></dl>
    <p id="tVoice" style="font-size:12px;color:var(--steel)"></p>
    <div class="say" id="tTap"></div>
  </div>
</div>

<div id="pigeon" hidden><div class="wing"></div><div class="body"></div><div class="head"></div><div class="eye"></div><div class="beak"></div></div>

<div class="overlay" id="modeCard" hidden>
  <div class="card">
    <div class="eyebrow" id="mcEyebrow">選擇模式</div>
    <h2 id="mcTitle">今天要怎麼教？</h2>
    <div class="modes">
      <button class="mode" id="mLesson"><b id="mLessonT">駕訓班模式</b><span id="mLessonD"></span><em id="mLessonP"></em></button>
      <button class="mode" id="mFree"><b id="mFreeT">自由探索模式</b><span id="mFreeD"></span><em id="mFreeP"></em></button>
    </div>
    <div class="say" id="mcSay"></div>
  </div>
</div>

<div class="overlay" id="levelCard" hidden>
  <div class="card">
    <div class="eyebrow" id="lcNum"></div>
    <h2 id="lcTitle"></h2>
    <div class="student"><div class="face" id="lcFace"><i></i></div><div><b id="lcName"></b><span id="lcTrait"></span></div></div>
    <p id="lcGoal"></p>
    <div class="say" id="lcSay"></div>
    <div class="tapnote" id="lcTap"></div>
  </div>
</div>

<div class="overlay" id="resultCard" hidden>
  <div class="card">
    <div class="eyebrow" id="rcNum"></div>
    <h2 id="rcTitle"></h2>
    <div class="stars" id="rcStars"></div>
    <div class="result">
      <div><b id="rcTime">0:00</b><span id="rcTimeL">時間</span></div>
      <div><b id="rcPen">0</b><span id="rcPenL">扣分</span></div>
    </div>
    <p id="rcLine"></p>
    <div class="say" id="rcSay"></div>
    <div class="tapnote" id="rcTap"></div>
  </div>
</div>

/* ======================= COMMANDS ======================= */
const TRAITS={
  dou:{react:[600,1100],maxIdx:3}, rush:{react:[250,500],maxIdx:4}, daisy:{react:[400,800],maxIdx:4,swap:0.25}, zzz:{react:[500,900],maxIdx:4,sleepy:true}
};
function trait(){ return TRAITS[st.student]; }
function command(cmd,fromVoice){
  if(cmd==="honk"){ honk(); return; }
  if(cmd==="hush"){ say("hush"); setTimeout(()=>{ muted=true; },1600); return; }
  if(cmd==="talk"){ muted=false; say("talk"); return; }
  if(cmd==="mMenu"){ if(st.mode!=="intro") showModeCard(); return; }
  if(st.mode==="modeSel"){ if(cmd==="mLesson") startLesson(); else if(cmd==="mFree") startFree(); return; }
  if(cmd==="sing"){ say("sing"); return; }
  if(cmd==="cheer"){ say("cheer"); st.panic=Math.max(0,st.panic-0.3); return; }
  if(cmd==="challenge"&&st.mode!=="card"){ if(st.mode==="roam"&&st.nearGate){ st.idx=0; st.turnLeft=0; st.pendingGate=st.nearGate; $("gatePrompt").hidden=true; showLevelCard(st.nearGate.lv); } return; }
  if(cmd==="focus"){ if(st.selfieT>0){ st.selfieT=0; say("focus"); } else say("noFocus"); return; }
  if(cmd==="calm"){ if(st.beeT>0){ st.beeT=0; st.idx=Math.min(st.idx,2); say("calm"); } else say("noCalm"); return; }
  if(st.mode==="card"){ if(cmd==="mStart"||cmd==="go"||cmd==="challenge") startLevel(st.pendingGate.lv); else if(cmd==="mCancel"||cmd==="stop"){ $("levelCard").hidden=true; st.mode="roam"; st.gateLock=st.pendingGate.lv.id; st.pendingGate=null; } return; }
  if(st.mode==="result"){ if(cmd==="mRetry") startLevel(lvl.def); else if(cmd==="mNext"&&st.lastWin) nextLevel(); else if(cmd==="mNext"&&gameMode==="lesson") startLevel(lvl.def); else if(cmd==="mMap"||cmd==="mCancel"||cmd==="mNext") backToMap(); return; }
  if(st.mode==="level"&&(cmd==="mQuit")){ backToMap(); return; }
  if(st.mode==="level"&&(cmd==="mRetry")){ startLevel(lvl.def); return; }
  if(st.mode!=="roam"&&st.mode!=="level") return;
  if(cmd.charAt(0)==="m") return;
  const [a,b]=trait().react; const delay=fromVoice?a+Math.random()*(b-a):120;
  setTimeout(()=>execute(cmd),delay);
}
function moving(){ return Math.abs(st.speed)>0.8||st.idx!==0||st.reverse; }
function execute(cmd){
  if(st.mode!=="roam"&&st.mode!=="level") return;
  const tr=trait();
  if(st.asleep){ if(cmd==="wake"){ st.asleep=false; st.sleepT=7+Math.random()*4; say("wake"); } return; }
  if(cmd==="wake"){ say("awake"); return; }
  if(tr.swap && (cmd==="left"||cmd==="right"||cmd==="nudgeL"||cmd==="nudgeR") && Math.random()<tr.swap){
    cmd={left:"right",right:"left",nudgeL:"nudgeR",nudgeR:"nudgeL"}[cmd]; say("mishear"); doTurn(cmd,true); return;
  }
  switch(cmd){
    case "go": st.reverse=false; if(st.idx<2) st.idx=Math.min(2,tr.maxIdx); say("go"); break;
    case "faster":
      st.reverse=false;
      if(st.student==="dou"&&st.idx>=1&&Math.random()<0.25){ say("fasterNo"); break; }
      if(st.idx>=tr.maxIdx){ say(st.student==="dou"?"fasterNo":"fasterMax"); break; }
      st.idx=Math.min(tr.maxIdx,Math.max(st.idx,1)+1); say("faster"); break;
    case "slower": st.lastSlow=st.clock; if(st.reverse){st.reverse=false;st.idx=0;say("stop");break;} if(st.idx<=1){ if(st.idx===1){st.idx=0;say("stop");} else say("slowerMin"); break;} st.idx--; say("slower"); break;
    case "stop": st.lastSlow=st.clock; if(lvl.def&&lvl.def.cake&&Math.abs(st.speed)>13) cakeHit(20); st.idx=0; st.reverse=false; st.turnLeft=0; say("stop"); break;
    case "reverse": st.reverse=true; st.idx=0; st.turnLeft=0; say("reverse"); break;
    case "straight": st.turnLeft=0; snapHeading(0.5); say("straight"); break;
    default: doTurn(cmd,false);
  }
}
function doTurn(cmd,silent){
  if(!moving()){ say("notMoving"); return; }
  const nudge=cmd==="nudgeL"||cmd==="nudgeR", left=cmd==="left"||cmd==="nudgeL";
  st.turnLeft=(left?1:-1)*(nudge?0.24:Math.PI/2); st.nudge=nudge;
  if(lvl.def&&lvl.def.cake&&!nudge&&Math.abs(st.speed)>15) cakeHit(15);
  if(!silent) say(cmd);
}
function snapHeading(tol){ const q=Math.PI/2,n=Math.round(st.heading/q)*q; if(Math.abs(n-st.heading)<tol) st.heading=n; }

function parse(text){
  const drive=st.mode==="roam"||st.mode==="level";
  const src=lang==="zh"?text:text.toLowerCase(), base=lang==="zh"?ZH:EN, menu=lang==="zh"?ZH_MENU:EN_MENU;
  const modeR=lang==="zh"?ZH_MODE:EN_MODE;
  const rules=st.mode==="modeSel"?modeR.concat(base):drive?base:menu.concat(base), found=[];
  rules.forEach(([re,cmd])=>{ re.lastIndex=0; let m; while((m=re.exec(src))){ found.push({i:m.index,len:m[0].length,cmd}); if(!m[0].length) re.lastIndex++; } });
  found.sort((a,b)=>a.i-b.i||b.len-a.len);
  const out=[]; let end=-1; for(const f of found){ if(f.i>=end){ out.push(f.cmd); end=f.i+f.len; } }
  return out;
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false, voiceState="off", processed={};
function showNotice(m){ const n=$("notice"); n.textContent=m; n.hidden=false; }
function updateVoiceUI(){ const v=$("voice"); v.classList.toggle("on",voiceState==="on"); $("voiceTxt").textContent=voiceState==="on"?L().listening:voiceState==="wait"?L().voiceWait:L().voiceOff; }
function startVoice(){
  if(!SR){ showNotice(L().noSR); return; }
  try{
    rec=new SR(); rec.lang=lang==="zh"?"zh-TW":"en-US"; rec.continuous=true; rec.interimResults=true; processed={};
    rec.onstart=()=>{ voiceState="on"; updateVoiceUI(); $("notice").hidden=true; };
    rec.onresult=e=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r=e.results[i], text=r[0].transcript, cmds=parse(text), done=processed[i]||0;
        const deaf = ttsBusy || performance.now()<ignoreUntil;
        if(!deaf) for(let c=done;c<cmds.length;c++) command(cmds[c],true);
        processed[i]=Math.max(done,cmds.length); if(deaf) continue; showHeard(text,cmds.length>0);
        if(r.isFinal&&cmds.length===0&&text.trim().length>1&&(st.mode==="roam"||st.mode==="level")) setTimeout(()=>say("unknown"),400);
      }
    };
    rec.onerror=e=>{ if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){ listening=false; voiceState="off"; updateVoiceUI(); showNotice(L().denied); } };
    rec.onend=()=>{ if(listening) setTimeout(()=>{ if(listening){ try{ processed={}; rec.start(); }catch(_){} } },150); else { voiceState="off"; updateVoiceUI(); } };
    listening=true; voiceState="wait"; updateVoiceUI(); rec.start();
  }catch(err){ listening=false; voiceState="off"; updateVoiceUI(); showNotice(L().denied); }
}
function stopVoice(){ listening=false; if(rec){ try{ rec.onend=null; rec.stop(); }catch(_){} } rec=null; voiceState="off"; updateVoiceUI(); }

let actx=null, engOsc=null, siren=null;
function initAudio(){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); engOsc=actx.createOscillator(); engOsc.type="sawtooth"; const lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=380; const g=actx.createGain(); g.gain.value=0.03; engOsc.connect(lp); lp.connect(g); g.connect(actx.destination); engOsc.start(); }catch(_){ actx=null; } }
function noise(len,vol){ if(!actx) return; const buf=actx.createBuffer(1,actx.sampleRate*len,actx.sampleRate),d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2); const s=actx.createBufferSource(); s.buffer=buf; const g=actx.createGain(); g.gain.value=vol; s.connect(g); g.connect(actx.destination); s.start(); }
function crashSound(big){ noise(big?0.45:0.18,big?0.5:0.25); }
function tone(freqs,type,dur,vol){ if(!actx) return; freqs.forEach((f,i)=>{ const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+i*0.09; o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+0.05); }); }
function dingSound(){ tone([660,880,1320],"triangle",0.3,0.18); }
function cpSound(){ tone([880],"triangle",0.2,0.12); }
function honk(){ tone([392,392],"square",0.25,0.12); say("honk"); st.honkT=1.2;
  if(st.pigeonT>0){ st.pigeonT=0; $("pigeon").hidden=true; setTimeout(()=>say("pigeonGone"),500); }
  if(st.student==="zzz"&&st.asleep&&Math.random()<0.5){ st.asleep=false; st.sleepT=7+Math.random()*4; setTimeout(()=>say("wake"),300); } }
function startSiren(){ if(!actx||siren) return; const o=actx.createOscillator(),g=actx.createGain(); o.type="triangle"; g.gain.value=0.06; o.connect(g); g.connect(actx.destination); o.start(); siren={o,g}; }
function stopSiren(){ if(siren){ try{ siren.o.stop(); }catch(_){} siren=null; } }

/* ======================= PHYSICS ======================= */
const R_CAR=1.9;
function penalty(kind,fatal){
  if(st.mode!=="level"){ return; }
  lvl.pen++; toast(L().pens[kind]+(fatal?"":"  -1"));
  if(fatal) endLevel(false,L().pens[kind]);
  else if(lvl.pen>=lvl.def.maxPen) endLevel(false,L().pens.tooMany);
}
function cakeHit(n){ lvl.cake=Math.max(0,lvl.cake-n); toast(L().pens.cake); say("cake"); if(lvl.cake<=0) endLevel(false,L().pens.cakeDead); }
function crash(nx,nz){
  if(st.cooldown>0) return;
  st.cooldown=1.1; st.shake=0.5; st.panic=Math.min(1,st.panic+0.3);
  st.speed=-Math.sign(st.speed||1)*2.5; st.idx=0; st.reverse=false; st.turnLeft=0; st.x+=nx*0.6; st.z+=nz*0.6;
  crashSound(true); say("crash");
  if(lvl.def&&lvl.def.cake) cakeHit(40);
  penalty("crash");
}
function hitBoxes(list){
  for(const p of list){
    const cx=Math.max(p.minx,Math.min(st.x,p.maxx)), cz=Math.max(p.minz,Math.min(st.z,p.maxz));
    const dx=st.x-cx, dz=st.z-cz, d=Math.hypot(dx,dz);
    if(d<R_CAR){ const nx=d>0.001?dx/d:0, nz=d>0.001?dz/d:0, push=R_CAR-d+0.05; st.x+=nx*push; st.z+=nz*push; if(Math.abs(st.speed)>2) crash(nx,nz); else st.speed=0; }
  }
}
function collide(){
  hitBoxes(solids); hitBoxes(lvl.solids);
  const lim=EDGE+HALF-R_CAR;
  if(Math.abs(st.x)>lim||Math.abs(st.z)>lim){ const nx=st.x>lim?-1:st.x<-lim?1:0, nz=st.z>lim?-1:st.z<-lim?1:0; st.x=Math.max(-lim,Math.min(lim,st.x)); st.z=Math.max(-lim,Math.min(lim,st.z)); if(Math.abs(st.speed)>2) crash(nx,nz); else st.speed=0; }
  if(st.mode==="roam") for(const n of npcs){ const p=npcPos(n),dx=st.x-p.x,dz=st.z-p.z,d=Math.hypot(dx,dz); if(d<3.4){ const nx=dx/(d||1),nz=dz/(d||1); st.x+=nx*(3.4-d); st.z+=nz*(3.4-d); crash(nx,nz);} }
  for(const c of lvl.cones){ if(c.vel) continue; const dx=c.g.position.x-st.x,dz=c.g.position.z-st.z,d=Math.hypot(dx,dz);
    if(d<1.8&&Math.abs(st.speed)>0.6){ const f=Math.max(4,Math.abs(st.speed)); c.vel={x:dx/(d||1)*f*0.8,y:5+f*0.3,z:dz/(d||1)*f*0.8}; c.spin=(Math.random()-.5)*14; crashSound(false); if(lvl.def.conePen&&!c.hit){ c.hit=true; penalty("cone"); } } }
}
const fwd=()=>[Math.sin(st.heading),Math.cos(st.heading)];

function stepLevel(dt){
  const def=lvl.def; lvl.time+=dt;
  // checkpoints
  if(lvl.cp<def.cps.length){ const [cx,cz,r]=def.cps[lvl.cp]; if(Math.hypot(st.x-cx,st.z-cz)<r){ cpMarkers[lvl.cp].visible=false; lvl.cp++; cpSound(); say("cp"); } }
  cpMarkers.forEach((m,i)=>{ if(m.visible) m.children.forEach(c=>c.material.opacity!==undefined&&(c.material.opacity=i===lvl.cp?(c.material.transparent?0.3:1):(c.material.transparent?0.08:0.35))); });
  // finish
  const f=def.finish;
  if(lvl.cp>=def.cps.length && st.x>f[0]&&st.x<f[1]&&st.z>f[2]&&st.z<f[3] && Math.abs(st.speed)<0.4){ lvl.stopT+=dt; if(lvl.stopT>0.8){ endLevel(true); return; } } else lvl.stopT=0;
  // level-specific rules
  if(def.id===1 && st.z>-182) penalty("over",true);
  if(def.timeLimit && lvl.time>def.timeLimit) penalty("timeout",true);
  if(def.limit){ if(Math.abs(st.speed)>def.limit){ lvl.speedT+=dt; if(lvl.speedT>1.2){ lvl.speedT=0; penalty("speed"); } } else lvl.speedT=Math.max(0,lvl.speedT-dt); }
  // traffic lights
  lvl.lights.forEach(l=>{
    const ph=(lvl.time+l.off)%12, s=ph<5?2:ph<7?1:0; l.state=s;
    l.bulbs.forEach((b,i)=>b.b.material.color.setHex(i===s?b.c:0x333333));
    const inside=Math.abs(st.x-l.x)<HALF&&Math.abs(st.z-l.z)<HALF;
    if(inside&&!l.inside&&s===0&&Math.abs(st.speed)>1) penalty("red");
    l.inside=inside;
  });
  // pedestrians
  lvl.peds.forEach(p=>{
    if(p.state==="wait" && st.z<p.z && p.z-st.z<38){ p.state="walk"; }
    if(p.state==="walk"){ p.x+=1.6*dt; p.p.position.x=p.x; p.p.position.y=Math.abs(Math.sin(lvl.time*8))*0.15; if(p.x>70){ p.state="done"; p.p.visible=false; } }
    if(p.state==="walk" && Math.hypot(st.x-p.x,st.z-p.z)<2 ){ penalty("ped",true); }
  });
  // ambulances
  if(def.amb){ def.amb.forEach((t0,i)=>{
    if(lvl.time>t0 && !lvl.ambDone[i] && !lvl.ambs[i]){ const car=makeCar(0xffffff,false); const red=new THREE.Mesh(box(2.34,0.25,4.44),new THREE.MeshBasicMaterial({color:0xff3b30})); red.position.y=1.15; car.add(red); const lamp=new THREE.Mesh(box(1.2,0.3,0.5),new THREE.MeshBasicMaterial({color:0xff3b30})); lamp.position.y=2.35; car.add(lamp); levelGroup.add(car); lvl.ambs[i]={car,lamp,z:st.z-55,x:120,judged:false}; startSiren(); }
    const a=lvl.ambs[i]; if(!a||lvl.ambDone[i]) return;
    a.z+=26*dt; const gap=st.z-a.z;
    const yielding=Math.abs(st.speed)<1.5 || (st.x-120)<=-2.2;
    if(!a.judged && gap<6){ a.judged=true; if(!yielding){ penalty("amb"); } }
    a.x = gap<12&&gap>-8 ? 120+(yielding?2.6:0) : 120; a.car.position.set(a.x,0,a.z);
    a.lamp.material.color.setHex(Math.floor(lvl.time*6)%2?0xff3b30:0x3b7bff);
    if(siren&&actx) siren.o.frequency.setTargetAtTime(Math.floor(lvl.time*2)%2?960:720,actx.currentTime,0.02);
    if(a.z>st.z+90||a.z>10){ lvl.ambDone[i]=true; levelGroup.remove(a.car); stopSiren(); }
  }); }
  // ducks
  lvl.ducks.forEach(d=>{
    if(d.vel){ d.vel.y-=22*dt; d.d.position.x+=d.vel.x*dt; d.d.position.y=Math.max(0,d.d.position.y+d.vel.y*dt); d.d.position.z+=d.vel.z*dt; d.d.rotation.x+=8*dt; return; }
    if(st.honkT>0 && Math.hypot(st.x-d.x,st.z-d.z)<32) d.flee=1;
    if(d.flee){ const target=d.x<180?166:194; d.x+=(target-d.x)*Math.min(1,dt*2.5); d.d.rotation.y=d.x<180?-Math.PI/2:Math.PI/2; }
    else { d.x+=d.dir*1.1*dt; if(d.x>186){d.dir=-1;} if(d.x<174){d.dir=1;} d.d.rotation.y=d.dir>0?Math.PI/2:-Math.PI/2; }
    d.d.position.x=d.x; d.d.position.y=Math.abs(Math.sin(lvl.time*10+d.z))*0.12;
    if(Math.hypot(st.x-d.x,st.z-d.z)<1.7&&Math.abs(st.speed)>1){ const [fx,fz]=fwd(); d.vel={x:fx*8+(Math.random()-.5)*6,y:7,z:fz*8}; penalty("duck"); crashSound(false); }
  });
  // melons
  lvl.melons.forEach(m=>{ if(m.hit) return; if(Math.hypot(st.x-m.x,st.z-m.z)<1.9&&Math.abs(st.speed)>0.8){ m.hit=true; m.m.material=mat(0xff4d6d); m.m.scale.set(2.2,0.15,2.2); m.m.position.y=0.1; crashSound(false); penalty("melon"); } });
}

function step(dt){
  st.clock+=dt; st.cooldown=Math.max(0,st.cooldown-dt); st.panic=Math.max(0,st.panic-dt*0.05); st.honkT=Math.max(0,(st.honkT||0)-dt);
  const tr=trait(), def=lvl.def, wet=def&&def.rain;
  // idle chatter
  st.chatT=(st.chatT||0)+dt;
  if(st.mode==="level"&&!st.asleep&&st.chatT>16&&!ttsBusy){ st.chatT=0; if(Math.random()<0.6) say("chat"); }
  // funny random events
  if((st.mode==="roam"||(st.mode==="level"&&def&&def.id>4)) && moving() && !st.asleep){
    st.eventT=(st.eventT??25)-dt;
    if(st.eventT<=0 && !(st.selfieT>0) && !(st.beeT>0) && !(st.pigeonT>0)){ st.eventT=26+Math.random()*18; startEvent(pick(["sneeze","selfie","pigeon","bee","sing","snack"])); }
  }
  if(st.selfieT>0){ st.selfieT-=dt; st.selfieDrift=(st.selfieDrift||0)-dt; if(st.selfieDrift<=0){ st.selfieDrift=1.2; if(st.turnLeft===0){ st.turnLeft=(Math.random()<0.5?-1:1)*0.12; st.nudge=true; } } }
  if(st.beeT>0){ st.beeT-=dt; st.beeJ=(st.beeJ||0)-dt; if(st.beeJ<=0){ st.beeJ=1.4; st.idx=1+Math.floor(Math.random()*4); st.reverse=false; st.panic=Math.min(1,st.panic+0.1); } }
  if(st.pigeonT>0){ st.pigeonT-=dt; if(st.pigeonT<=0) $("pigeon").hidden=true; }
  // personality behaviours
  if(st.student==="rush" && !st.reverse && st.idx>0){ st.autoT+=dt; if(st.autoT>5){ st.autoT=0; if(st.clock-st.lastSlow>4.5&&st.idx<4){ st.idx++; say("auto"); } } }
  if(tr.sleepy && st.mode==="level" && moving()){
    if(!st.asleep){ st.sleepT-=dt; if(st.sleepT<=0){ st.asleep=true; st.driftT=1.5; say("sleep"); } }
    else { st.driftT-=dt; if(st.driftT<=0){ st.driftT=2+Math.random(); st.turnLeft=(Math.random()<0.5?-1:1)*0.2; st.nudge=true; if(Math.random()<0.35) say("sleep"); else $("bubble").textContent=pick(LINES[lang].sleep); } }
  }
  // speed
  const target=st.reverse?-6:SPEEDS[st.idx];
  const braking=Math.abs(target)<Math.abs(st.speed)||Math.sign(target)!==Math.sign(st.speed);
  const acc=(braking?16:8)*(wet?(braking?0.45:0.7):1);
  if(st.speed<target) st.speed=Math.min(target,st.speed+acc*dt); else st.speed=Math.max(target,st.speed-acc*dt);
  // steering
  if(st.turnLeft!==0&&Math.abs(st.speed)>0.5){
    const rate=Math.abs(st.speed)/6.5*(st.nudge?0.7:1), yaw=Math.sign(st.turnLeft)*Math.min(Math.abs(st.turnLeft),rate*dt);
    st.heading+=yaw*Math.sign(st.speed); st.turnLeft-=yaw;
    if(Math.abs(st.turnLeft)<1e-4){ st.turnLeft=0; if(!st.nudge) snapHeading(0.2); }
  }
  // lane assist on roads (not where the level asks for precision)

  collide();
  // NPC traffic
  if(st.mode==="roam") for(const n of npcs){ n.s+=n.dir*n.speed*dt; if(n.s>EDGE+10)n.s=-EDGE-10; if(n.s<-EDGE-10)n.s=EDGE+10; const p=npcPos(n); n.car.position.set(p.x,0,p.z); n.car.rotation.y=n.axis==="z"?(n.dir>0?0:Math.PI):(n.dir>0?Math.PI/2:-Math.PI/2); }
  // cones flying
  for(const c of lvl.cones){ if(!c.vel) continue; c.vel.y-=22*dt; c.g.position.x+=c.vel.x*dt; c.g.position.y=Math.max(0,c.g.position.y+c.vel.y*dt); c.g.position.z+=c.vel.z*dt; c.g.rotation.x+=c.spin*dt; if(c.g.position.y<=0){c.vel.x*=0.6;c.vel.z*=0.6;c.vel.y=Math.abs(c.vel.y)*0.3;c.spin*=0.5; if(Math.abs(c.vel.x)+Math.abs(c.vel.z)<0.3) c.vel=null;} }

    if(b.g.position.y<=0){ b.vel.x*=0.6; b.vel.z*=0.6; b.vel.y=Math.abs(b.vel.y)*0.3; b.spin*=0.5; }
    if(b.t>15){ b.vel=null; b.g.position.set(b.home.x,0,b.home.z); b.g.rotation.set(0,0,0); } });
  if(st.mode==="level") stepLevel(dt);
}

function startEvent(kind){
  if(kind==="sneeze"){ say("sneeze"); setTimeout(()=>{ if(st.mode==="roam"||st.mode==="level"){ st.turnLeft=(Math.random()<0.5?-1:1)*0.3; st.nudge=true; st.shake=0.3; } },900); }
  else if(kind==="selfie"){ st.selfieT=9; say("selfie"); }
  else if(kind==="pigeon"){ st.pigeonT=14; $("pigeon").hidden=false; say("pigeon"); }
  else if(kind==="bee"){ st.beeT=9; st.beeJ=0.5; say("bee"); }
  else if(kind==="sing"){ say("sing"); }
  else say("snack");
}
function clearEvents(){ st.selfieT=0; st.beeT=0; st.pigeonT=0; const pg=document.getElementById("pigeon"); if(pg) pg.hidden=true; }

/* ======================= HUD ======================= */
const mini=$("mini"), mg=mini.getContext("2d");
function currentTarget(){
  if(lvl.def){ const d=lvl.def; if(lvl.cp<d.cps.length) return {x:d.cps[lvl.cp][0],z:d.cps[lvl.cp][1]}; const f=d.finish; return {x:(f[0]+f[1])/2,z:(f[2]+f[3])/2}; }
  let best=null,bd=1e9;
  cups.forEach(c=>{ if(c.got) return; const d=Math.hypot(st.x-c.x,st.z-c.z); if(d<bd){bd=d;best=c;} });
  gates.forEach(g=>{ if(stars[g.lv.id]) return; const d=Math.hypot(st.x-g.x,st.z-g.z)+40; if(d<bd){bd=d;best=g;} });
  return best?{x:best.x,z:best.z}:{x:st.x,z:st.z+1};
}
function computeHint(t,rel,dist){
  const u=U(), def=lvl.def, stopped=Math.abs(st.speed)<0.5&&st.idx===0&&!st.reverse;
  if(st.asleep) return [u.hSleep,"wake"];
  if(st.pigeonT>0) return [u.hPigeon,"honk"];
  if(st.beeT>0) return [u.hBee,"calm"];
  if(st.selfieT>0) return [u.hSelfie,"focus"];
  if(st.mode==="roam"&&st.nearGate) return [u.hGate(st.nearGate.lv.id,st.nearGate.lv[lang].t),"challenge"];
  if(def){
    const red=lvl.lights.find(l=>l.state===0&&Math.abs(st.x-l.x)<4&&l.z-st.z>0&&l.z-st.z<30);
    if(red&&!stopped) return [u.hRed,"stop"];
    const ped=lvl.peds.find(p=>p.state==="walk"&&p.z-st.z>0&&p.z-st.z<28);
    if(ped&&!stopped) return [u.hPed,"stop"];
    if(lvl.ambs.some((a,i)=>a&&!lvl.ambDone[i]&&st.z-a.z<45)) return [u.hAmb,"nudgeR"];
    if(lvl.ducks.some(d=>!d.flee&&!d.vel&&d.z-st.z>0&&d.z-st.z<34)) return [u.hDuck,"honk"];
    if(lvl.cp>=def.cps.length){
      const f=def.finish, inBox=st.x>f[0]&&st.x<f[1]&&st.z>f[2]&&st.z<f[3];
      if(inBox) return stopped?[u.hHold,"stop"]:[u.hBox,"stop"];
      if(def.id===3&&!st.reverse&&stopped) return [u.hReverse,"reverse"];
      if(def.id===3) return [u.hReverse,"stop"];
      if(dist<16) return [u.hBox,"stop"];
    }
  }
  if(stopped) return [u.hStart,"go"];
  if(Math.abs(rel)>2.5) return [u.hBehind,"reverse"];
  if(Math.abs(rel)<0.3) return [u.hStraight,"faster"];
  const left=rel>0;
  if(Math.abs(rel)<0.9||inYard(st.x,st.z)||dist<25) return left?[u.hNudgeL,"nudgeL"]:[u.hNudgeR,"nudgeR"];
  const q=Math.PI/2,n=Math.round(st.heading/q)*q, alongZ=Math.abs(Math.cos(n))>0.5, dir=alongZ?Math.sign(Math.cos(n)):Math.sign(Math.sin(n));
  const pos=alongZ?st.z:st.x; let nextI=(dir>0?Math.ceil(pos/BLOCK):Math.floor(pos/BLOCK))*BLOCK; let dI=(nextI-pos)*dir;

}
const CMD_ROWS_LEVEL=["go","faster","slower","stop","left","right","nudgeL","nudgeR","straight","reverse","honk","wake","menu"];
function renderCmds(hot){
  const u=U(), extra=[];

  if(st.selfieT>0) extra.push("focus"); if(st.beeT>0) extra.push("calm");
  const keys=CMD_ROWS_LEVEL.filter(k=>k!=="wake"||st.student==="zzz"||st.asleep).concat(extra).concat(["sing"]);
  const sig=lang+keys.join()+hot; if(renderCmds.sig===sig) return; renderCmds.sig=sig;
  $("cmdTitle").textContent=u.cmdTitle;
  $("cmdRows").innerHTML=keys.map(k=>{ const r=u.rows[k]; return '<div class="cmdrow'+(k===hot?" hot":"")+'"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>'; }).join("");
}
function chip(text,cls){ return '<span class="panel chip '+(cls||"")+'">'+text+"</span>"; }
function drawHUD(){
  const t=currentTarget(), dx=t.x-st.x, dz=t.z-st.z; let rel=Math.atan2(dx,dz)-st.heading; rel=Math.atan2(Math.sin(rel),Math.cos(rel));
  $("arrowSvg").style.transform="rotate("+(-rel)+"rad)"; $("dist").textContent=Math.round(Math.hypot(dx,dz))+" m";
  const driving=st.mode==="roam"||st.mode==="level";
  $("cmdPanel").hidden=!driving;

    html+=chip(fmt(lvl.time));
    if(d.timeLimit) html+=chip(tt.chipTime(Math.max(0,Math.ceil(d.timeLimit-lvl.time))),d.timeLimit-lvl.time<15?"warn":"");
    if(d.cake) html+=chip(tt.chipCake(lvl.cake),lvl.cake<50?"warn":"ok");
    if(d.limit) html+=chip(tt.chipLimit,Math.abs(st.speed)>d.limit?"warn":"");
    const red=lvl.lights.find(l=>l.state===0&&Math.abs(st.x-l.x)<4&&l.z-st.z>0&&l.z-st.z<35); if(red) html+=chip(tt.chipRed,"warn");

  const S=mini.width, sc=S/190;
  mg.setTransform(1,0,0,1,0,0); mg.fillStyle="#8ccf6a"; mg.fillRect(0,0,S,S);
  mg.translate(S/2,S/2); mg.rotate(st.heading); mg.scale(-sc,-sc); mg.translate(-st.x,-st.z);
  mg.fillStyle="#4a4f63"; for(let k=-GRID;k<=GRID;k++){ mg.fillRect(k*BLOCK-HALF,-EDGE-HALF,ROAD,EDGE*2+ROAD); mg.fillRect(-EDGE-HALF,k*BLOCK-HALF,EDGE*2+ROAD,ROAD); }
  mg.fillStyle="#c9cfdc"; mg.fillRect(YARD.x0,YARD.z0,YARD.x1-YARD.x0,YARD.z1-YARD.z0);

  else { gates.forEach(g=>{ mg.fillStyle=stars[g.lv.id]?"#2fbf8f":"#ff5a4e"; mg.beginPath(); mg.arc(g.x,g.z,5,0,Math.PI*2); mg.fill(); });
    mg.fillStyle="#ffc93c"; cups.forEach(c=>{ if(!c.got){ mg.beginPath(); mg.arc(c.x,c.z,4,0,Math.PI*2); mg.fill(); } }); }
  mg.setTransform(1,0,0,1,0,0); mg.fillStyle="#ff8a2a"; mg.strokeStyle="#1d2340"; mg.lineWidth=3;
  mg.beginPath(); mg.moveTo(S/2,S/2-12); mg.lineTo(S/2+9,S/2+10); mg.lineTo(S/2-9,S/2+10); mg.closePath(); mg.fill(); mg.stroke();
}

/* ======================= LOOP ======================= */
const camPos=new THREE.Vector3(SPAWN.x,8,SPAWN.z-14), look=new THREE.Vector3();
st.x=SPAWN.x; st.z=SPAWN.z;
let last=performance.now(), hudT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(st.mode==="roam"||st.mode==="level") step(dt);
  player.position.set(st.x,0,st.z); player.rotation.y=st.heading; blob.position.set(st.x,0.04,st.z);
  st.speak=Math.max(0,st.speak-dt);
  const sm=studentModels[st.student], panicky=st.cooldown>0||st.panic>0.5;
  sm.userData.eyes.forEach(e=>e.scale.set(1,st.asleep?0.15:(panicky?1.45:1),1));
  sm.userData.mouth.scale.set(1,st.speak>0?1+Math.abs(Math.sin(now/70))*3:(panicky?3:1),1);
  sm.userData.head.rotation.z=st.asleep?0.5:(st.turnLeft!==0?Math.sign(st.turnLeft)*0.15:0);
  sm.rotation.z=st.cooldown>0?Math.sin(now/40)*0.08:0;
  coach.userData.eyes.forEach(e=>e.scale.setScalar(st.cooldown>0?1.5:1));
  coach.rotation.y=st.cooldown>0?Math.sin(now/90)*0.3:0.25;
  wheelS.rotation.z=st.turnLeft*1.2;
  gates.forEach(g=>{ g.ring.rotation.z+=dt; g.grp.visible=!lvl.def&&gameMode==="free"&&st.mode!=="modeSel"; });
  cups.forEach(c=>{ if(!c.got){ c.g.rotation.y+=dt*2; c.g.position.y=1.2+Math.sin(now/300+c.x)*0.4; c.g.visible=gameMode==="free"&&!lvl.def; } });
  bins.forEach(b=>b.g.visible=!lvl.def);
  { const showMark=st.mode==="roam"||st.mode==="level"; const tg=currentTarget();
    targetMark.visible=showMark; carArrow.visible=showMark;
    if(showMark){ targetMark.position.set(tg.x,0,tg.z); targetDiamond.position.y=12+Math.sin(now/250)*1.2; targetDiamond.rotation.y+=dt*2;
      carArrow.position.set(st.x,5.2+Math.sin(now/200)*0.25,st.z); carArrow.rotation.y=Math.atan2(tg.x-st.x,tg.z-st.z); } }
  cpMarkers.forEach(m=>{ if(m.children[1]) m.children[1].rotation.z+=dt*1.5; });
  if(rain){ const p=rain.geometry.attributes.position; for(let i=0;i<p.count;i++){ let y=p.getY(i)-40*dt; if(y<0) y+=30; p.setY(i,y); } p.needsUpdate=true; rain.position.set(st.x,0,st.z); }
  const [fx,fz]=fwd();
  camPos.lerp(new THREE.Vector3(st.x-fx*12,6.5,st.z-fz*12),1-Math.exp(-dt*4)); camera.position.copy(camPos);
  if(st.shake>0){ st.shake=Math.max(0,st.shake-dt); camera.position.x+=(Math.random()-.5)*st.shake*1.6; camera.position.y+=(Math.random()-.5)*st.shake*1.2; }
  look.set(st.x+fx*5,1.8,st.z+fz*5); camera.lookAt(look);
  if(engOsc&&actx) engOsc.frequency.setTargetAtTime(48+Math.abs(st.speed)*7,actx.currentTime,0.1);
  hudT+=dt; if(hudT>0.08){ hudT=0; drawHUD(); }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ======================= BOOT ======================= */

  $("intro").hidden=true;

  showModeCard(); startVoice();
});
applyLang();
requestAnimationFrame(frame);
