<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>崩潰教練</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: full-screen 3D canvas; HUD pinned top; student bubble + voice status pinned bottom; cards overlay. Single sunny-cartoon look. */
:root{
  --sky:#8fd3ff; --ink:#1d2340; --paper:#fffaf0; --sun:#ffc93c; --tomato:#ff5a4e; --mint:#2fbf8f; --steel:#5a6488; --cream:#f2ecdc;
  --font-display:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  --font-body:"Noto Sans TC","Baloo 2",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#stage{position:fixed;inset:0;}
#stage canvas{display:block;width:100%;height:100%;}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);}

.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;}
.left-col{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:62%;}
.goal{padding:6px 10px;}
.goal small{display:block;font-size:10px;letter-spacing:.06em;color:var(--steel);font-weight:700;}
.goal b{display:block;font-size:14px;line-height:1.35;}
.nav{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;align-self:flex-start;}
.arrow{width:42px;height:42px;border-radius:50%;background:var(--mint);display:grid;place-items:center;border:3px solid var(--ink);flex:none;}
.arrow svg{width:24px;height:24px;}
.navtxt{display:flex;flex-direction:column;line-height:1.1;}
.navtxt b{font-family:var(--font-display);font-size:19px;font-variant-numeric:tabular-nums;}
.navtxt span{font-size:11px;color:var(--steel);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:3px 9px;font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;border-radius:10px;}
.chip.warn{background:var(--tomato);color:#fff;}
.chip.ok{background:var(--mint);color:#fff;}
.right-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
#mini{width:104px;height:104px;display:block;border-radius:11px;}
.mini-wrap{overflow:hidden;}
.lang{display:flex;padding:3px;gap:3px;pointer-events:auto;}
.lang button{font:700 12px var(--font-body);border:0;background:transparent;color:var(--ink);padding:4px 8px;border-radius:9px;cursor:pointer;}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}

.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);font:900 clamp(22px,7vw,34px) var(--font-display);color:#fff;background:var(--tomato);border:4px solid var(--ink);border-radius:18px;padding:8px 18px;box-shadow:0 6px 0 var(--ink);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.toast.good{background:var(--mint);}

.deck{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.talk{width:100%;max-width:560px;display:flex;flex-direction:column;gap:6px;}
.bubble{align-self:flex-start;max-width:88%;padding:7px 12px;font-weight:700;font-size:15px;}
.bubble::before{content:attr(data-who);display:block;font-size:10px;color:var(--steel);letter-spacing:.06em;font-weight:700;}
.heard{align-self:flex-end;max-width:88%;padding:6px 12px;background:var(--ink);color:var(--paper);border-radius:14px;font-size:13px;min-height:30px;}
.heard:empty{display:none;}
.heard em{font-style:normal;color:var(--sun);}
.voice{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;}
.voice .dot{width:10px;height:10px;border-radius:50%;background:var(--steel);}
.voice.on .dot{background:var(--tomato);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.25}}
.notice{font-size:12px;background:var(--paper);border:2px dashed var(--tomato);border-radius:10px;padding:6px 10px;max-width:560px;width:100%;line-height:1.5;}

.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(29,35,64,.55);z-index:5;overflow-y:auto;}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;}
.card h1{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1;margin:0;text-wrap:balance;}
.card h1 small{display:block;font-size:.4em;color:var(--steel);letter-spacing:.08em;margin-top:6px;}
.card h2{font-size:22px;margin:0;line-height:1.2;text-wrap:balance;}
.card p{margin:0;line-height:1.6;font-size:14px;}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--steel);}
.student{display:flex;gap:10px;align-items:center;background:var(--cream);border-radius:14px;padding:10px;}
.face{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);flex:none;position:relative;overflow:hidden;}
.face i{position:absolute;left:0;right:0;top:0;height:42%;}
.student b{display:block;}
.student span{font-size:12px;color:var(--steel);line-height:1.4;}
.say{background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;}
.say em{font-style:normal;color:var(--sun);font-weight:900;}
.cmds{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;background:var(--cream);border-radius:12px;padding:10px 12px;}
.cmds dt{font-weight:900;}
.cmds dd{margin:0;color:var(--steel);}
.stars{font-size:40px;letter-spacing:6px;color:var(--sun);-webkit-text-stroke:2px var(--ink);text-align:center;line-height:1;}
.stars .off{color:#e2dccb;}
.result{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center;}
.result div{background:var(--cream);border-radius:12px;padding:8px 4px;}
.result b{display:block;font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums;}
.result span{font-size:11px;color:var(--steel);}
.tapnote{font-size:11px;color:var(--steel);text-align:center;}
@media (prefers-reduced-motion:reduce){.voice.on .dot{animation:none}.toast{transition:none}}
</style>

<div id="stage"></div>

<div class="hud">
  <div class="left-col">
    <div class="panel goal"><small id="goalLbl">自由駕駛</small><b id="goalTxt">開到旗子的位置挑戰關卡</b></div>
    <div class="panel nav">
      <div class="arrow"><svg id="arrowSvg" viewBox="0 0 24 24"><path d="M12 2 L20 20 L12 15 L4 20 Z" fill="#fffaf0" stroke="#1d2340" stroke-width="2" stroke-linejoin="round"/></svg></div>
      <div class="navtxt"><b id="dist">0 m</b><span id="distLbl">下一個目標</span></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="right-col">
    <div class="panel lang" role="group" aria-label="Language"><button id="lzh" aria-pressed="true">中文</button><button id="len" aria-pressed="false">EN</button></div>
    <div class="panel mini-wrap"><canvas id="mini" width="208" height="208"></canvas></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="deck">
  <div class="talk">
    <div class="bubble panel" id="bubble" data-who="學員">……</div>
    <div class="heard" id="heard"></div>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="voice panel" id="voice"><span class="dot"></span><span id="voiceTxt">語音未啟動</span></div>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <h1 id="tTitle">崩潰教練<small id="tSub">PANIC COACH</small></h1>
    <p id="tDesc"></p>
    <dl class="cmds" id="cmdList"></dl>
    <p id="tVoice" style="font-size:12px;color:var(--steel)"></p>
    <div class="say" id="tTap"></div>
  </div>
</div>

<div class="overlay" id="levelCard" hidden>
  <div class="card">
    <div class="eyebrow" id="lcNum"></div>
    <h2 id="lcTitle"></h2>
    <div class="student"><div class="face" id="lcFace"><i></i></div><div><b id="lcName"></b><span id="lcTrait"></span></div></div>
    <p id="lcGoal"></p>
    <div class="say" id="lcSay"></div>
    <div class="tapnote" id="lcTap"></div>
  </div>
</div>

<div class="overlay" id="resultCard" hidden>
  <div class="card">
    <div class="eyebrow" id="rcNum"></div>
    <h2 id="rcTitle"></h2>
    <div class="stars" id="rcStars"></div>
    <div class="result">
      <div><b id="rcTime">0:00</b><span id="rcTimeL">時間</span></div>
      <div><b id="rcPen">0</b><span id="rcPenL">扣分</span></div>
    </div>
    <p id="rcLine"></p>
    <div class="say" id="rcSay"></div>
    <div class="tapnote" id="rcTap"></div>
  </div>
</div>

function addStatic(geo,material,x,y,z,ry){

  let b=batches.get(material); if(!b){b=[];batches.set(material,b);} b.push(geo);
}
function flushStatic(){
  for(const [material,geos] of batches){
    let n=0; geos.forEach(g=>n+=g.attributes.position.count);
    if(!n) continue;
    const pos=new Float32Array(n*3),nor=new Float32Array(n*3),uv=new Float32Array(n*2); let o=0;
    geos.forEach(g=>{pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);if(g.attributes.uv)uv.set(g.attributes.uv.array,o*2);o+=g.attributes.position.count;});
    const G=new THREE.BufferGeometry();
    G.setAttribute("position",new THREE.BufferAttribute(pos,3));G.setAttribute("normal",new THREE.BufferAttribute(nor,3));G.setAttribute("uv",new THREE.BufferAttribute(uv,2));
    scene.add(new THREE.Mesh(G,material));
  }
  batches.clear();
}

const EN=[
  [/\b(a little|a bit|slightly|bear) left\b/g,"nudgeL"],[/\b(a little|a bit|slightly|bear) right\b/g,"nudgeR"],
  [/\bleft\b/g,"left"],[/\bright\b/g,"right"],

  [/\bmap\b|\bcontinue\b/g,"mMap"],

function parse(text){
  const drive=st.mode==="roam"||st.mode==="level";
  const src=lang==="zh"?text:text.toLowerCase(), base=lang==="zh"?ZH:EN, menu=lang==="zh"?ZH_MENU:EN_MENU;
  const rules=drive?base:menu.concat(base), found=[];
  rules.forEach(([re,cmd])=>{ re.lastIndex=0; let m; while((m=re.exec(src))){ found.push({i:m.index,len:m[0].length,cmd}); if(!m[0].length) re.lastIndex++; } });
  found.sort((a,b)=>a.i-b.i||b.len-a.len);
  const out=[]; let end=-1; for(const f of found){ if(f.i>=end){ out.push(f.cmd); end=f.i+f.len; } }
  return out;
}

  if(!SR){ showNotice(L().noSR); return; }

    rec=new SR(); rec.lang=lang==="zh"?"zh-TW":"en-US"; rec.continuous=true; rec.interimResults=true; processed={};

const R_CAR=1.9;

function cakeHit(n){ lvl.cake=Math.max(0,lvl.cake-n); toast(L().pens.cake); say("cake"); if(lvl.cake<=0) endLevel(false,L().pens.cakeDead); }
function crash(nx,nz){
  if(st.cooldown>0) return;
  st.cooldown=1.1; st.shake=0.5; st.panic=Math.min(1,st.panic+0.3);
  st.speed=-Math.sign(st.speed||1)*2.5; st.idx=0; st.reverse=false; st.turnLeft=0; st.x+=nx*0.6; st.z+=nz*0.6;

}
function hitBoxes(list){
  for(const p of list){
    const cx=Math.max(p.minx,Math.min(st.x,p.maxx)), cz=Math.max(p.minz,Math.min(st.z,p.maxz));
    const dx=st.x-cx, dz=st.z-cz, d=Math.hypot(dx,dz);
    if(d<R_CAR){ const nx=d>0.001?dx/d:0, nz=d>0.001?dz/d:0, push=R_CAR-d+0.05; st.x+=nx*push; st.z+=nz*push; if(Math.abs(st.speed)>2) crash(nx,nz); else st.speed=0; }
  }
}
function collide(){

  if(Math.abs(st.x)>lim||Math.abs(st.z)>lim){ const nx=st.x>lim?-1:st.x<-lim?1:0, nz=st.z>lim?-1:st.z<-lim?1:0; st.x=Math.max(-lim,Math.min(lim,st.x)); st.z=Math.max(-lim,Math.min(lim,st.z)); if(Math.abs(st.speed)>2) crash(nx,nz); else st.speed=0; }
  if(st.mode==="roam") for(const n of npcs){ const p=npcPos(n),dx=st.x-p.x,dz=st.z-p.z,d=Math.hypot(dx,dz); if(d<3.4){ const nx=dx/(d||1),nz=dz/(d||1); st.x+=nx*(3.4-d); st.z+=nz*(3.4-d); crash(nx,nz);} }
  for(const c of lvl.cones){ if(c.vel) continue; const dx=c.g.position.x-st.x,dz=c.g.position.z-st.z,d=Math.hypot(dx,dz);
    if(d<1.8&&Math.abs(st.speed)>0.6){ const f=Math.max(4,Math.abs(st.speed)); c.vel={x:dx/(d||1)*f*0.8,y:5+f*0.3,z:dz/(d||1)*f*0.8}; c.spin=(Math.random()-.5)*14; crashSound(false); if(lvl.def.conePen&&!c.hit){ c.hit=true; penalty("cone"); } } }
}
const fwd=()=>[Math.sin(st.heading),Math.cos(st.heading)];

function stepLevel(dt){

}

function step(dt){
  st.clock+=dt; st.cooldown=Math.max(0,st.cooldown-dt); st.panic=Math.max(0,st.panic-dt*0.05); st.honkT=Math.max(0,(st.honkT||0)-dt);

  // steering
  if(st.turnLeft!==0&&Math.abs(st.speed)>0.5){
    const rate=Math.abs(st.speed)/6.5*(st.nudge?0.7:1), yaw=Math.sign(st.turnLeft)*Math.min(Math.abs(st.turnLeft),rate*dt);
    st.heading+=yaw*Math.sign(st.speed); st.turnLeft-=yaw;
    if(Math.abs(st.turnLeft)<1e-4){ st.turnLeft=0; if(!st.nudge) snapHeading(0.2); }
  }
  // lane assist on roads (not where the level asks for precision)
  if(!(def&&def.noAssist) && st.turnLeft===0 && Math.abs(st.speed)>0.5 && !st.asleep){
    const q=Math.PI/2,n=Math.round(st.heading/q)*q, alongZ=Math.abs(Math.cos(n))>0.5;
    const lat=alongZ?st.x:st.z, near=Math.round(lat/BLOCK)*BLOCK, off=near-lat;
    if(Math.abs(n-st.heading)<0.3 && Math.abs(off)<HALF && !inYard(st.x,st.z)){
      st.heading+=(n-st.heading)*Math.min(1,dt*1.2);
      const mv=Math.sign(off)*Math.min(Math.abs(off),1.6*dt); if(alongZ) st.x+=mv; else st.z+=mv;
    }
  }
  st.x+=Math.sin(st.heading)*st.speed*dt; st.z+=Math.cos(st.heading)*st.speed*dt;
  collide();
  // NPC traffic
  if(st.mode==="roam") for(const n of npcs){ n.s+=n.dir*n.speed*dt; if(n.s>EDGE+10)n.s=-EDGE-10; if(n.s<-EDGE-10)n.s=EDGE+10; const p=npcPos(n); n.car.position.set(p.x,0,p.z); n.car.rotation.y=n.axis==="z"?(n.dir>0?0:Math.PI):(n.dir>0?Math.PI/2:-Math.PI/2); }
  // cones flying
  for(const c of lvl.cones){ if(!c.vel) continue; c.vel.y-=22*dt; c.g.position.x+=c.vel.x*dt; c.g.position.y=Math.max(0,c.g.position.y+c.vel.y*dt); c.g.position.z+=c.vel.z*dt; c.g.rotation.x+=c.spin*dt; if(c.g.position.y<=0){c.vel.x*=0.6;c.vel.z*=0.6;c.vel.y=Math.abs(c.vel.y)*0.3;c.spin*=0.5; if(Math.abs(c.vel.x)+Math.abs(c.vel.z)<0.3) c.vel=null;} }
  // gates
  if(st.mode==="roam"){
    let near=null; gates.forEach(g=>{ if(Math.hypot(st.x-g.x,st.z-g.z)<5) near=g; });
    if(st.gateLock!==null && (!near||near.lv.id!==st.gateLock)){ const g=gates.find(g=>g.lv.id===st.gateLock); if(!g||Math.hypot(st.x-g.x,st.z-g.z)>9) st.gateLock=null; }
    if(near && st.gateLock!==near.lv.id){
      if(gateUnlocked(near.lv.id)){ st.idx=0; st.speed=0; st.turnLeft=0; st.pendingGate=near; showLevelCard(near.lv); }
      else { toast(L().locked(near.lv.id)); st.gateLock=near.lv.id; }
    }
  }
  if(st.mode==="level") stepLevel(dt);
}

/* ======================= HUD ======================= */
const mini=$("mini"), mg=mini.getContext("2d");
function currentTarget(){
  if(lvl.def){ const d=lvl.def; if(lvl.cp<d.cps.length) return {x:d.cps[lvl.cp][0],z:d.cps[lvl.cp][1]}; const f=d.finish; return {x:(f[0]+f[1])/2,z:(f[2]+f[3])/2}; }
  let best=null,bd=1e9; gates.forEach(g=>{ if(!gateUnlocked(g.lv.id)) return; const sc=(stars[g.lv.id]?400:0)+Math.hypot(st.x-g.x,st.z-g.z); if(sc<bd){bd=sc;best=g;} }); return best?{x:best.x,z:best.z}:{x:st.x,z:st.z+1};
}
function chip(text,cls){ return '<span class="panel chip '+(cls||"")+'">'+text+"</span>"; }
function drawHUD(){
  const t=currentTarget(), dx=t.x-st.x, dz=t.z-st.z; let rel=Math.atan2(dx,dz)-st.heading; rel=Math.atan2(Math.sin(rel),Math.cos(rel));
  $("arrowSvg").style.transform="rotate("+(-rel)+"rad)"; $("dist").textContent=Math.round(Math.hypot(dx,dz))+" m";
  let html="";
  if(lvl.def&&st.mode==="level"){
    const d=lvl.def, tt=L();
    html+=chip(tt.chipPen(lvl.pen,d.maxPen),lvl.pen>=d.maxPen-1?"warn":"");
    html+=chip(fmt(lvl.time));
    if(d.timeLimit) html+=chip(tt.chipTime(Math.max(0,Math.ceil(d.timeLimit-lvl.time))),d.timeLimit-lvl.time<15?"warn":"");
    if(d.cake) html+=chip(tt.chipCake(lvl.cake),lvl.cake<50?"warn":"ok");
    if(d.limit) html+=chip(tt.chipLimit,Math.abs(st.speed)>d.limit?"warn":"");
    const red=lvl.lights.find(l=>l.state===0&&Math.abs(st.x-l.x)<4&&l.z-st.z>0&&l.z-st.z<35); if(red) html+=chip(tt.chipRed,"warn");
    if(st.asleep) html+=chip(tt.chipSleep,"warn");
  }
  $("chips").innerHTML=html;
  // minimap (heading-up; +z is up, +x is left)
  const S=mini.width, sc=S/190;
  mg.setTransform(1,0,0,1,0,0); mg.fillStyle="#8ccf6a"; mg.fillRect(0,0,S,S);
  mg.translate(S/2,S/2); mg.rotate(st.heading); mg.scale(-sc,-sc); mg.translate(-st.x,-st.z);
  mg.fillStyle="#4a4f63"; for(let k=-GRID;k<=GRID;k++){ mg.fillRect(k*BLOCK-HALF,-EDGE-HALF,ROAD,EDGE*2+ROAD); mg.fillRect(-EDGE-HALF,k*BLOCK-HALF,EDGE*2+ROAD,ROAD); }
  mg.fillStyle="#c9cfdc"; mg.fillRect(YARD.x0,YARD.z0,YARD.x1-YARD.x0,YARD.z1-YARD.z0);
  if(lvl.def){ mg.fillStyle="#2fbf8f"; lvl.def.cps.forEach((c,i)=>{ if(i>=lvl.cp){ mg.beginPath(); mg.arc(c[0],c[1],i===lvl.cp?6:3.5,0,Math.PI*2); mg.fill(); } }); const f=lvl.def.finish; mg.fillStyle="#ffffff"; mg.fillRect(f[0],f[2],f[1]-f[0],f[3]-f[2]); }
  else gates.forEach(g=>{ mg.fillStyle=gateUnlocked(g.lv.id)?(stars[g.lv.id]?"#2fbf8f":"#ffc93c"):"#9a968c"; mg.beginPath(); mg.arc(g.x,g.z,6,0,Math.PI*2); mg.fill(); });
  mg.setTransform(1,0,0,1,0,0); mg.fillStyle="#ff8a2a"; mg.strokeStyle="#1d2340"; mg.lineWidth=3;
  mg.beginPath(); mg.moveTo(S/2,S/2-12); mg.lineTo(S/2+9,S/2+10); mg.lineTo(S/2-9,S/2+10); mg.closePath(); mg.fill(); mg.stroke();
}

/* ======================= LOOP ======================= */
const camPos=new THREE.Vector3(SPAWN.x,8,SPAWN.z-14), look=new THREE.Vector3();
st.x=SPAWN.x; st.z=SPAWN.z;
let last=performance.now(), hudT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(st.mode==="roam"||st.mode==="level") step(dt);
  player.position.set(st.x,0,st.z); player.rotation.y=st.heading; blob.position.set(st.x,0.04,st.z);
  st.speak=Math.max(0,st.speak-dt);
  const sm=studentModels[st.student], panicky=st.cooldown>0||st.panic>0.5;
  sm.userData.eyes.forEach(e=>e.scale.set(1,st.asleep?0.15:(panicky?1.45:1),1));
  sm.userData.mouth.scale.set(1,st.speak>0?1+Math.abs(Math.sin(now/70))*3:(panicky?3:1),1);
  sm.userData.head.rotation.z=st.asleep?0.5:(st.turnLeft!==0?Math.sign(st.turnLeft)*0.15:0);
  sm.rotation.z=st.cooldown>0?Math.sin(now/40)*0.08:0;
  coach.userData.eyes.forEach(e=>e.scale.setScalar(st.cooldown>0?1.5:1));
  coach.rotation.y=st.cooldown>0?Math.sin(now/90)*0.3:0.25;
  wheelS.rotation.z=st.turnLeft*1.2;
  gates.forEach(g=>{ g.ring.rotation.z+=dt; g.grp.visible=!lvl.def; });
  cpMarkers.forEach(m=>{ if(m.children[1]) m.children[1].rotation.z+=dt*1.5; });
  if(rain){ const p=rain.geometry.attributes.position; for(let i=0;i<p.count;i++){ let y=p.getY(i)-40*dt; if(y<0) y+=30; p.setY(i,y); } p.needsUpdate=true; rain.position.set(st.x,0,st.z); }
  const [fx,fz]=fwd();
  camPos.lerp(new THREE.Vector3(st.x-fx*12,6.5,st.z-fz*12),1-Math.exp(-dt*4)); camera.position.copy(camPos);
  if(st.shake>0){ st.shake=Math.max(0,st.shake-dt); camera.position.x+=(Math.random()-.5)*st.shake*1.6; camera.position.y+=(Math.random()-.5)*st.shake*1.2; }
  look.set(st.x+fx*5,1.8,st.z+fz*5); camera.lookAt(look);
  if(engOsc&&actx) engOsc.frequency.setTargetAtTime(48+Math.abs(st.speed)*7,actx.currentTime,0.1);
  hudT+=dt; if(hudT>0.08){ hudT=0; drawHUD(); }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ======================= BOOT ======================= */
$("intro").addEventListener("click",()=>{
  $("intro").hidden=true; st.mode="roam";
  if(!actx) initAudio(); else if(actx.state==="suspended") actx.resume();
  say("start"); startVoice();
});
applyLang();
requestAnimationFrame(frame);
window.__game={get muted(){return muted;},speak,st,lvl,LEVELS,gates,parse,command,execute,startLevel,backToMap,setLang,stars};
})();
</script>
